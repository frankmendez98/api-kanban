stages:
  - sonarqube-check
  - sonarqube-vulnerability-report

sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  #  Tells git to fetch all the branches of the project, required by the analysis task
  tags:
    - sfce-app-ng
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=${SONAR_PROJECT_KEY}
      -Dsonar.projectName=${SONAR_PROJECT_NAME}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dproject.settings=./sonar-project.properties
      -Dsonar.branch.name=${SONAR_BRANCH_NAME:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
      -Dsonar.branch.target=${SONAR_BRANCH_NAME:-$CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
      -Dsonar.qualitygate.wait=false

  allow_failure: true
  rules:
    # Solo análisis cuando el MR va hacia develop
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      when: on_success
    - when: never



sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: curlimages/curl:8.11.0
  tags:
    - sfce-app-ng
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=certificados_firma-electronica365-backend_e7e50dea-3717-4e90-a8cc-e282b23d9ca9&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  
  artifacts:
    expire_in: 1 day
    
  dependencies:
    - sonarqube-check
  rules:
    # Solo tiene sentido cuando el pipeline es un MR hacia develop--
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      when: on_success
    - when: never

